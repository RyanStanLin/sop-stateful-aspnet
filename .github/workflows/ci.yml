name: CI and deployment
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  invalidate_cache:
    if: github.event_name == 'push' && !github.event.repository.is_template
    permissions: {contents: read, actions: read, id-token: write}
    uses: Deploy-ryanl-in/personal-paas/.github/workflows/operate.yml@472a450fa4a7f8caca1b8b7c2b451eb7758dc442
    with:
      deployment-url: https://deploy.ryanl.in
      action: clear-route-cache
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.401'}
      - run: dotnet restore --locked-mode
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build --no-restore -c Release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0'}
      - name: Local PostgreSQL Redis JSON and WebSocket integration
        run: bash scripts/local-smoke.sh
  release:
    needs: [test, invalidate_cache]
    if: github.event_name == 'push' && !github.event.repository.is_template
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    uses: Deploy-ryanl-in/personal-paas/.github/workflows/release.yml@472a450fa4a7f8caca1b8b7c2b451eb7758dc442
    with:
      deployment-url: https://deploy.ryanl.in
      domain: ryanl.in
      platform-repository: Deploy-ryanl-in/personal-paas
      platform-sha: 472a450fa4a7f8caca1b8b7c2b451eb7758dc442
    secrets:
      PAAS_SECRETS: ${{ secrets.PAAS_SECRETS }}
